# Copy to ~/.config/pitwall/config.toml (or point PITWALL_CONFIG at it). All keys optional.

data_dir = "~/PitwallData"

[capture]
bind_host = "0.0.0.0"
port = 20777
# Copies of every packet go here (live analysis / UI in later stages). Empty list = no forwarding.
forward = ["127.0.0.1:20778"]
# Only accept packets from these IPs (e.g. your PS5). Empty = accept all.
allow_sources = []
rotate_seconds = 300      # start a new raw segment every 5 minutes...
rotate_mb = 256           # ...or at this size, whichever comes first
compress = true           # compress closed segments (lossless, verified)
status_interval_s = 5.0
expected_hz = 60          # the PS5 "UDP Send Rate"; used by the health checks

[reference]
# Where real F1 reference laps are downloaded from ({season} is replaced, e.g. 2025).
# Default: the TracingInsights archive of FastF1 data on GitHub; change to use a mirror.
base_url = "https://raw.githubusercontent.com/TracingInsights/{season}/main/"
schedule_url = "https://raw.githubusercontent.com/theOehrly/f1schedule/master/schedule_{season}.json"
timeout_s = 30.0

[engineer]
# The race engineer's local language model, served by Ollama on this Mac (ollama.com).
provider = "ollama"
model = "qwen3:14b"          # choose with `pitwall engineer eval` on your own laps
base_url = "http://127.0.0.1:11434"
timeout_s = 180.0
temperature = 0.2
num_ctx = 8192               # context window; lower it if memory is tight
think = false                # thinking mode of models that have one (slower)

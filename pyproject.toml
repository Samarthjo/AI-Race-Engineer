[project]
name = "pitwall-ai"
version = "0.5.0"
description = "Personal F1 race engineer: F1 25 telemetry capture, lap analysis and benchmarking."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "zstandard>=0.22",
    "numpy>=2.0",
    "pyarrow>=16",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
pitwall = "pitwall.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "httpx2>=0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pitwall"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
